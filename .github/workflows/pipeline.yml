name: Spotify Medallion Pipeline

on:
  schedule:
    # 10:00 e 22:00 UTC correspondem a 07:00 e 19:00 no horário de Brasília (UTC-3)
    - cron: '0 10,22 * * *'
  workflow_dispatch: # Permite rodar manualmente clicando em "Run workflow"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do código (main)
        uses: actions/checkout@v4

      - name: 2. Recuperar histórico anterior da branch data-lake (se existir)
        run: |
          git fetch origin data-lake || true
          git checkout origin/data-lake -- data/ || mkdir -p data/bronze data/silver data/gold

      - name: 3. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 4. Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Injetar credenciais via GitHub Secrets e rodar pipeline
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URL: ${{ secrets.SPOTIFY_REDIRECT_URL }}
          SPOTIPY_CACHE: ${{ secrets.SPOTIPY_CACHE }}
        run: |
          cat <<EOF > .env
          SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID
          SPOTIFY_CLIENT_SECRET=$SPOTIFY_CLIENT_SECRET
          SPOTIFY_REDIRECT_URL=$SPOTIFY_REDIRECT_URL
          EOF
          printf '%s' "$SPOTIPY_CACHE" > .cache
          python src/main.py
          rm -f .env .cache

      - name: 6. Publicar camadas Bronze, Silver e Gold na branch data-lake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B data-lake
          git add -f data/
          git commit -m "chore(data): update medallion layers $(date -u +'%Y-%m-%d %H:%M UTC')" || exit 0
          git push -f origin data-lake